name: Build Flat Cherry Linux x86_64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iso/x86_64/**"
      - ".github/workflows/build-x64.yml"

permissions:
  contents: read

concurrency:
  group: flat-cherry-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with Archiso in an Arch Linux container
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out" "${GITHUB_WORKSPACE}/work"
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm archiso grub
              profile=/tmp/flat-cherry-profile
              mkdir -p "$profile"
              cp -a /usr/share/archiso/configs/baseline/. "$profile/"
              cp /workspace/iso/x86_64/profiledef.sh "$profile/profiledef.sh"
              cp /workspace/iso/x86_64/packages.x86_64 "$profile/packages.x86_64"
              mkarchiso -v -w /workspace/work -o /workspace/out "$profile"
            '

      - name: Verify build output and create checksum
        run: |
          shopt -s nullglob
          images=(out/*.iso)
          test "${#images[@]}" -eq 1
          sha256sum "${images[0]}" > out/SHA256SUMS
          file "${images[0]}"
          iso_bytes=$(stat -c%s "${images[0]}")
          echo "ISO size: ${iso_bytes} bytes"
          if (( iso_bytes >= 800000000 )); then
            echo "::warning::ISO is still at or above the 800 MB target"
          else
            echo "::notice::ISO is below the 800 MB target"
          fi

      - name: Upload ISO build candidate
        uses: actions/upload-artifact@v4
        with:
          name: flat-cherry-x86_64-build-candidate
          path: out/*
          if-no-files-found: error
          retention-days: 14
