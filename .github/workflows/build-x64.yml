name: Build Flat Cherry Linux x86_64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iso/x86_64/**"
      - ".github/workflows/build-x64.yml"

permissions:
  contents: read

concurrency:
  group: flat-cherry-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with Archiso in an Arch Linux container
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out" "${GITHUB_WORKSPACE}/work"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm archiso
              mkarchiso -v -w /workspace/work -o /workspace/out /workspace/iso/x86_64
            '

      - name: Verify build output and create checksum
        run: |
          shopt -s nullglob
          images=(out/*.iso)
          test "${#images[@]}" -eq 1
          sha256sum "${images[0]}" > out/SHA256SUMS
          file "${images[0]}"

      - name: Upload ISO build candidate
        uses: actions/upload-artifact@v4
        with:
          name: flat-cherry-x86_64-build-candidate
          path: out/*
          if-no-files-found: error
          retention-days: 14
