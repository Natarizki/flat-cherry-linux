name: Build Flat Cherry Linux x86_64

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "iso/x86_64/**"
      - ".github/workflows/build-x64.yml"
      - "docs/BUILDING.md"

permissions:
  contents: write

concurrency:
  group: flat-cherry-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Void-based live ISO
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out"
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            ghcr.io/void-linux/void-mklive:latest \
            /bin/bash -euo pipefail -c '
              xbps-install -Syu git
              git clone --depth 1 https://github.com/void-linux/void-mklive.git /tmp/void-mklive
              /bin/bash /workspace/iso/x86_64/build.sh /tmp/void-mklive /workspace/out
            '

      - name: Verify ISO and create checksum
        run: |
          shopt -s nullglob
          images=(out/*.iso)
          test "${#images[@]}" -eq 1
          sudo apt-get update
          sudo apt-get install -y xorriso
          iso="${images[0]}"

          # Confirm that both BIOS and UEFI El Torito boot entries exist.
          xorriso -indev "$iso" -report_el_torito plain | tee out/ELTORITO-REPORT.txt
          grep -Eqi 'BIOS|0x00' out/ELTORITO-REPORT.txt
          grep -Eqi 'UEFI|EFI|0xef' out/ELTORITO-REPORT.txt

          # Report the system area for review. The build script strips the
          # upstream isohybrid MBR/GPT/APM options before image creation.
          xorriso -indev "$iso" -report_system_area plain | tee out/SYSTEM-AREA-REPORT.txt

          sha256sum "$iso" > out/SHA256SUMS
          file "$iso"
          iso_bytes=$(stat -c%s "$iso")
          echo "ISO size: ${iso_bytes} bytes"
          if (( iso_bytes >= 800000000 )); then
            echo "::warning::ISO is still at or above the 800 MB target"
          else
            echo "::notice::ISO is below the 800 MB target"
          fi

      - name: Publish ISO directly to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
            out/ELTORITO-REPORT.txt
            out/SYSTEM-AREA-REPORT.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload ISO build candidate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: flat-cherry-x86_64-build-candidate
          path: out/*
          if-no-files-found: error
          retention-days: 14
